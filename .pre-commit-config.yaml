repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: bun run format:check
        language: system
        pass_filenames: false
        # Keep the hook scoped to the root tooling and the PocketBase JS
        # migrations. apps/android is ignored by Biome.
        files: ^(apps/pocketbase/|scripts/|biome\.json$|package\.json$|bunfig\.toml$)
